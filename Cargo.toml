[package]
name = "runt"
version = "0.3.0"
authors = ["Todd Mortimer <todd@opennet.ca>"]
edition = "2024"
rust-version = "1.89"
description = "IMAP / Maildir synchronization program"
repository = "https://github.com/mordak/runt"
keywords = ["email", "imap", "maildir"]
categories = ["command-line-utilities", "email"]
license = "MIT"

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
dirs = "7.0.0"
imap = { version = "3.0.0-alpha.15", default-features = false, features = ["rustls-tls"] }
imap-proto = "0.16.7"
libc = "0.2.191"
maildir = "0.6.6"
notify-debouncer-full = "0.7.0"
rayon = "1.12.0"
rusqlite = "0.41.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

#[patch.crates-io]
#imap = { path = "/home/todd/code/rust-imap" }
